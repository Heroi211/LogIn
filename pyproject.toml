[project]
name = "login-backend"
version = "1.0.0"
description = "Backend template FastAPI — users, roles, auth, messaging"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=70"
markers = [
  "unit: testes unitários",
  "integration: testes de integração HTTP",
]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/venv/*",
  "*/__pycache__/*",
  "src/repositories/sqlalchemy/*",
  "src/repositories/twilio/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  "htmlcov",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["tests/", "venv/", ".venv/"]
