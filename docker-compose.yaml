version: "3.9"

# Stack base — produção/staging (API + PostgreSQL)
# Desenvolvimento: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up

services:
  db_login:
    build:
      dockerfile: ./docker/db.dockerfile
      context: .
    image: login_database:v1
    container_name: database_login
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - nwlogin
    volumes:
      - pgdata:/var/lib/postgresql/data/
      - ./init_db:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_login:
    build:
      dockerfile: ./docker/api.dockerfile
      context: .
    image: login_api:v1
    container_name: api_login
    command: sh -c "python main.py"
    env_file:
      - .env
    depends_on:
      db_login:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - nwlogin
    volumes:
      - ./logs:/var/www/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  nwlogin:
    name: "nwlogin"
    driver: "bridge"

volumes:
  pgdata:
