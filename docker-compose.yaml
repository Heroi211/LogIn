name: gestao_tickets

# Stack base — produção/staging (API + PostgreSQL + pgAdmin)
# Hot reload: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up

services:
  database_gt:
    build:
      dockerfile: ./docker/db.dockerfile
      context: .
    image: gestao_tickets_database:v1
    container_name: database_gt
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - gestao_tickets
    volumes:
      - gestao_tickets_pgdata:/var/lib/postgresql/data/
      - ./init_db:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_gt:
    build:
      dockerfile: ./docker/api.dockerfile
      context: .
    image: gestao_tickets_api:v1
    container_name: api_gt
    command: sh -c "python main.py"
    env_file:
      - .env
    depends_on:
      database_gt:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - gestao_tickets
    volumes:
      - ./logs:/var/www/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  pgadmin_gt:
    build:
      dockerfile: ./docker/pgadmin.dockerfile
      context: .
    image: gestao_tickets_pgadmin:v1
    container_name: pgadmin_gt
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      database_gt:
        condition: service_healthy
    networks:
      - gestao_tickets

networks:
  gestao_tickets:
    name: gestao_tickets
    driver: bridge

volumes:
  gestao_tickets_pgdata:
    name: gestao_tickets_pgdata
